services:
  mysql:
    image: mysql:8.4
    container_name: filetodoc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: filetodoc
      MYSQL_USER: filetodoc
      MYSQL_PASSWORD: filetodoc
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - filetodoc_mysql:/var/lib/mysql

volumes:
  filetodoc_mysql:
